[tools]
node = "24.20.0"

[env]
_.file = "frontend/.env.development"

[tasks."be:build"]
description = "Build the Strapi backend"
dir = "backend"
run = "npm run build"

[tasks."be:types"]
description = "Generate Strapi TypeScript types"
dir = "backend"
run = "npm run types"

[tasks."be:openapi"]
description = "Generate the Strapi OpenAPI schema"
dir = "backend"
run = "npm run openapi"

[tasks."be:dev"]
description = "Run the Strapi 5 backend"
dir = "backend"
run = "npm run dev"

[tasks."fe:build"]
description = "Build the Next.js frontend"
dir = "frontend"
run = "npm run build"

[tasks."fe:lint"]
description = "Lint the frontend with Biome"
dir = "frontend"
run = "npm run lint"

[tasks."fe:typecheck"]
description = "Type-check the frontend"
dir = "frontend"
run = "npm run typecheck"

[tasks."fe:openapi"]
description = "Generate frontend types from the OpenAPI schema"
dir = "frontend"
run = "npm run openapi"

[tasks."fe:check"]
description = "Lint and type-check the frontend"
dir = "frontend"
run = "npm run check"

[tasks."fe:format"]
description = "Format the frontend with Biome"
dir = "frontend"
run = "npm run format"

[tasks."fe:dev"]
description = "Run the Next.js frontend"
dir = "frontend"
run = "npm run dev"

[tasks."dev"]
run = [
  { tasks = ["be:dev", "fe:dev"] }
]
