[tools]
node = "24.20.0"

[tasks."be:build"]
description = "Build the Strapi backend"
dir = "backend"
run = "npm run build"

[tasks."be:types"]
description = "Generate Strapi TypeScript types"
dir = "backend"
run = "npm run types"

[tasks."be:openapi"]
description = "Generate the Strapi OpenAPI schema"
dir = "backend"
run = "npm run openapi"

[tasks."be:dev"]
description = "Run the Strapi 5 backend"
dir = "backend"
run = "npm run dev"

[tasks."backupd:lint"]
description = "Lint backupd with Biome"
dir = "backupd"
run = "npm run lint"

[tasks."backupd:format"]
description = "Format backupd with Biome"
dir = "backupd"
run = "npm run format"

[tasks."backupd:typecheck"]
description = "Type-check backupd"
dir = "backupd"
run = "npm run typecheck"

[tasks."backupd:check"]
description = "Lint and type-check backupd"
dir = "backupd"
run = "npm run check"

[tasks."backupd:test"]
description = "Run backupd native tests"
dir = "backupd"
run = "npm test"

[tasks."fe:build"]
description = "Build the Next.js frontend"
dir = "frontend"
run = "npm run build"

[tasks."fe:lint"]
description = "Lint the frontend with Biome"
dir = "frontend"
run = "npm run lint"

[tasks."fe:typecheck"]
description = "Type-check the frontend"
dir = "frontend"
run = "npm run typecheck"

[tasks."fe:openapi"]
description = "Generate frontend types from the OpenAPI schema"
dir = "frontend"
run = "npm run openapi"

[tasks."fe:check"]
description = "Lint and type-check the frontend"
dir = "frontend"
run = "npm run check"

[tasks."fe:test"]
description = "Run the frontend unit tests"
dir = "frontend"
run = "npm test"

[tasks."fe:format"]
description = "Format the frontend with Biome"
dir = "frontend"
run = "npm run format"

[tasks."fe:dev"]
description = "Run the Next.js frontend"
dir = "frontend"
run = "npm run dev"

[tasks."strapid:lint"]
description = "Lint strapid with Biome"
dir = "strapid"
run = "npm run lint"

[tasks."strapid:format"]
description = "Format strapid with Biome"
dir = "strapid"
run = "npm run format"

[tasks."strapid:typecheck"]
description = "Type-check strapid"
dir = "strapid"
run = "npm run typecheck"

[tasks."strapid:check"]
description = "Lint and type-check strapid"
dir = "strapid"
run = "npm run check"

[tasks."strapid:test"]
description = "Run strapid native tests"
dir = "strapid"
run = "npm test"

[tasks."dev"]
run = [
  { tasks = ["be:dev", "fe:dev"] }
]
