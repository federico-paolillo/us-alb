services:
  backend:
    build:
      context: ./backend
      args:
        SERVER_URL: ${SERVER_URL:?SERVER_URL is required}
        ADMIN_COOKIE_PATH: ${ADMIN_COOKIE_PATH:?ADMIN_COOKIE_PATH is required}
    environment:
      ENV_PATH: /run/secrets/backend.env
      HOST: 0.0.0.0
      PORT: 65101
    secrets:
      - source: app_env
        target: backend.env
    read_only: true
    volumes:
      - backend_data:/data
      - backend_config:/config
    tmpfs:
      - /tmp:mode=1777
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      args:
        CMS_MEDIA_URL: ${CMS_MEDIA_URL:?CMS_MEDIA_URL is required}
        SITE_URL: ${SITE_URL:?SITE_URL is required}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:?NEXT_PUBLIC_APP_VERSION is required}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 65100
    depends_on:
      - backend
    secrets:
      - source: app_env
        target: frontend.env
    read_only: true
    tmpfs:
      - /app/.next/cache:mode=1777
      - /tmp:mode=1777
    networks:
      - app

  gateway:
    image: caddy:2-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - 127.0.0.1:65102:65102
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /var/lib/caddy:mode=1777
    networks:
      app:
        aliases:
          - us-alb.localhost

secrets:
  app_env:
    file: ./.env.example

volumes:
  backend_data:
  backend_config:

networks:
  app:
    driver: bridge
