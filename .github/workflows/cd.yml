name: cd

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      full_sha: ${{ steps.metadata.outputs.full_sha }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      image_prefix: ${{ steps.metadata.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate configuration and prepare image metadata
        id: metadata
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for argument in SITE_URL; do
            if [[ -z "${!argument}" ]]; then
              printf '::error::Repository variable %s is required\n' "$argument"
              exit 1
            fi
          done

          full_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short HEAD)
          {
            printf 'full_sha=%s\n' "$full_sha"
            printf 'short_sha=%s\n' "$short_sha"
            printf 'image_prefix=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            build_contexts: ""
            build_args: |
              CMS_MEDIA_URL=${{ vars.CMS_MEDIA_URL }}
              SITE_URL=${{ vars.SITE_URL }}
              NEXT_PUBLIC_APP_VERSION=${{ needs.prepare.outputs.full_sha }}
          - image: backend
            build_contexts: |
              strapid=./strapid
            build_args: |
              APPLICATION_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
              APPLICATION_GIT_REVISION=${{ needs.prepare.outputs.full_sha }}
              SITE_URL=${{ vars.SITE_URL }}
              CMS_PUBLIC_URL=${{ vars.CMS_PUBLIC_URL }}
              CMS_ADMIN_COOKIE_PATH=${{ vars.CMS_ADMIN_COOKIE_PATH }}
          - image: backupd
            build_contexts: |
              strapid=./strapid
            build_args: |
              APPLICATION_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
              APPLICATION_GIT_REVISION=${{ needs.prepare.outputs.full_sha }}
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.image }}
      FULL_SHA: ${{ needs.prepare.outputs.full_sha }}
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.full_sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          # Setting explicit flags replaces the action's insecure entitlement defaults.
          buildkitd-flags: --oci-worker-gc=true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.image }}
          build-contexts: ${{ matrix.build_contexts }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.FULL_SHA }}
          provenance: mode=max
          attests: type=sbom,generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      - name: Sign build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Extract image SBOM
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME@$IMAGE_DIGEST" \
            --format '{{ json .SBOM.SPDX }}' > "$RUNNER_TEMP/sbom.spdx.json"
      - name: Sign image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify published attestations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for predicate_type in https://slsa.dev/provenance/v1 https://spdx.dev/Document; do
            gh attestation verify "oci://$IMAGE_NAME@$IMAGE_DIGEST" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cd.yml" \
              --source-digest "$FULL_SHA" \
              --deny-self-hosted-runners \
              --predicate-type "$predicate_type"
          done
      - name: Summarize published image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### Published image\n\n'
            printf '| Property | Value |\n| --- | --- |\n'
            printf '| Tag | %s:%s |\n' "$IMAGE_NAME" "$SHORT_SHA"
            printf '| Commit | %s |\n' "$FULL_SHA"
            printf '| Digest | %s |\n' "$IMAGE_DIGEST"
            printf '| Immutable reference | %s@%s |\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  delivery:
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.full_sha }}
          persist-credentials: false
      - name: Assemble deployment artifact
        shell: bash
        env:
          FULL_SHA: ${{ needs.prepare.outputs.full_sha }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          archive="$RUNNER_TEMP/us-alb-deployment-$SHORT_SHA.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix=us-alb-deployment/ \
            --output="$archive" \
            "$FULL_SHA" \
            .env.example \
            Caddyfile \
            compose.prod.yml \
            otel-config.yml

          mapfile -t members < <(tar -tzf "$archive")
          expected=(
            us-alb-deployment/
            us-alb-deployment/.env.example
            us-alb-deployment/Caddyfile
            us-alb-deployment/compose.prod.yml
            us-alb-deployment/otel-config.yml
          )
          if [[ "${members[*]}" != "${expected[*]}" ]]; then
            printf '::error::Deployment artifact member set is not exact\n'
            exit 1
          fi
      - name: Upload deployment artifact
        id: deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/us-alb-deployment-${{ needs.prepare.outputs.short_sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30
          archive: false
      - name: Summarize deployment artifact
        shell: bash
        env:
          FULL_SHA: ${{ needs.prepare.outputs.full_sha }}
          ARTIFACT_URL: ${{ steps.deployment.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.deployment.outputs.artifact-digest }}
        run: |
          {
            printf '### Deployment artifact\n\n'
            printf '| Property | Value |\n| --- | --- |\n'
            printf '| Commit | %s |\n' "$FULL_SHA"
            printf '| Artifact | %s |\n' "$ARTIFACT_URL"
            printf '| Digest | %s |\n' "$ARTIFACT_DIGEST"
            printf '| Files | `.env.example`, `Caddyfile`, `compose.prod.yml`, `otel-config.yml` |\n'
          } >> "$GITHUB_STEP_SUMMARY"
